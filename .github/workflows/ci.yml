name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci-placeholder-service-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      AI_SUPABASE_URL: https://placeholder-ai.supabase.co
      AI_SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-ai-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # Unit tests substitute the database/auth boundary and do not use repository secrets.
      - run: python -m pytest -q
      - run: python -m ruff check app tests

  ai-v2:
    name: AI V2 tests, Ruff, and mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: habittrace_ai_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: habittrace_ai_v2/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      # Tests use synthetic fixtures; no Supabase credentials are supplied.
      - run: python -m pytest -q
      - run: python -m ruff check src tests
      - run: python -m mypy src

  frontend:
    name: Frontend tests, types, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: habittrace_frontend_dev-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: habittrace_frontend_dev-main/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      # Placeholder public values keep the static build offline; they are not credentials.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
